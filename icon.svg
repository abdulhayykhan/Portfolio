<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#071b16" />
      <stop offset="60%" stop-color="#040c10" />
      <stop offset="100%" stop-color="#020509" />
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78ff6b" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#78ff6b" stop-opacity="0.3" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Soft Glow for Window Line -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="8" y="8" width="496" height="496" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- CRT Scanlines Subtle Texture -->
  <line x1="24" y1="160" x2="488" y2="160" stroke="#78ff6b" stroke-opacity="0.04" stroke-width="2" />
  <line x1="24" y1="200" x2="488" y2="200" stroke="#78ff6b" stroke-opacity="0.04" stroke-width="2" />
  <line x1="24" y1="240" x2="488" y2="240" stroke="#78ff6b" stroke-opacity="0.04" stroke-width="2" />
  <line x1="24" y1="280" x2="488" y2="280" stroke="#78ff6b" stroke-opacity="0.04" stroke-width="2" />
  <line x1="24" y1="320" x2="488" y2="320" stroke="#78ff6b" stroke-opacity="0.04" stroke-width="2" />
  <line x1="24" y1="360" x2="488" y2="360" stroke="#78ff6b" stroke-opacity="0.04" stroke-width="2" />
  <line x1="24" y1="400" x2="488" y2="400" stroke="#78ff6b" stroke-opacity="0.04" stroke-width="2" />

  <!-- Terminal Window Titlebar -->
  <rect x="12" y="12" width="488" height="96" rx="96" fill="#050d0a" fill-opacity="0.75" />
  <circle cx="76" cy="62" r="13" fill="#ff5f56" />
  <circle cx="116" cy="62" r="13" fill="#ffbd2e" />
  <circle cx="156" cy="62" r="13" fill="#27c93f" />

  <!-- Terminal Window Path -->
  <text x="312" y="70" fill="#78ff6b" fill-opacity="0.6" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="22" font-weight="600" text-anchor="middle" letter-spacing="1">ahk@term:~</text>

  <!-- Titlebar Separator Line -->
  <line x1="24" y1="108" x2="488" y2="108" stroke="#78ff6b" stroke-opacity="0.25" stroke-width="3" filter="url(#softGlow)" />

  <!-- Terminal Prompt Chevron > -->
  <path
    d="M 54 212 L 102 260 L 54 308"
    fill="none"
    stroke="#78ff6b"
    stroke-width="24"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Letter 'A' -->
  <path
    d="M 144 340 L 186 182 L 228 340"
    fill="none"
    stroke="#9cff98"
    stroke-width="26"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />
  <line
    x1="160"
    y1="288"
    x2="212"
    y2="288"
    stroke="#9cff98"
    stroke-width="24"
    stroke-linecap="round"
    filter="url(#glow)"
  />

  <!-- Letter 'H' -->
  <line
    x1="262"
    y1="182"
    x2="262"
    y2="340"
    stroke="#9cff98"
    stroke-width="26"
    stroke-linecap="round"
    filter="url(#glow)"
  />
  <line
    x1="334"
    y1="182"
    x2="334"
    y2="340"
    stroke="#9cff98"
    stroke-width="26"
    stroke-linecap="round"
    filter="url(#glow)"
  />
  <line
    x1="262"
    y1="261"
    x2="334"
    y2="261"
    stroke="#9cff98"
    stroke-width="24"
    stroke-linecap="round"
    filter="url(#glow)"
  />

  <!-- Letter 'K' -->
  <line
    x1="372"
    y1="182"
    x2="372"
    y2="340"
    stroke="#9cff98"
    stroke-width="26"
    stroke-linecap="round"
    filter="url(#glow)"
  />
  <path
    d="M 444 184 L 374 260 L 446 340"
    fill="none"
    stroke="#9cff98"
    stroke-width="26"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Terminal Block Cursor (Flashing indicator) -->
  <rect
    x="464"
    y="298"
    width="18"
    height="42"
    rx="4"
    fill="#78ff6b"
    filter="url(#glow)"
  />

  <!-- Bottom Terminal Tag -->
  <text
    x="256"
    y="432"
    fill="#38bdf8"
    fill-opacity="0.8"
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
    font-size="20"
    font-weight="700"
    letter-spacing="5"
    text-anchor="middle"
  >DUET &#8226; AI ENGINEER</text>
</svg>
