<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#071b16" />
      <stop offset="60%" stop-color="#040c10" />
      <stop offset="100%" stop-color="#020509" />
    </radialGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="8" y="8" width="496" height="496" rx="96" fill="url(#bgGrad)" />

  <!-- AHK, terminal monospace style (measured: ~238px wide at font-size 130, centered at x=246 to leave room for cursor) -->
  <text
    x="246"
    y="300"
    fill="#78ff6b"
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
    font-size="130"
    font-weight="700"
    letter-spacing="4"
    text-anchor="middle"
    filter="url(#glow)"
  >AHK</text>

  <!-- Terminal cursor: underscore style beneath the text, unambiguous as a cursor rather than a 4th letter -->
  <rect x="150" y="330" width="132" height="14" rx="4" fill="#78ff6b" filter="url(#glow)" />
</svg>
